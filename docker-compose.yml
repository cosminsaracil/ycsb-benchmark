services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    container_name: redis-ycsb
    networks:
      - ycsb-network

  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    container_name: mongo-ycsb
    networks:
      - ycsb-network

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    container_name: postgres-ycsb
    environment:
      POSTGRES_DB: ycsb
      POSTGRES_USER: ycsb
      POSTGRES_PASSWORD: ycsb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ycsb-network

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    container_name: mysql-ycsb
    environment:
      MYSQL_DATABASE: ycsb
      MYSQL_USER: ycsb
      MYSQL_PASSWORD: ycsb
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ycsb-network

  ycsb:
    build:
      context: .
      dockerfile: Dockerfile.ycsb
    container_name: ycsb-client
    depends_on:
      - redis
      - mongodb
      - postgres
      - mysql
    networks:
      - ycsb-network
    volumes:
      - ./results:/ycsb/results
      - ./scripts:/ycsb/scripts
    working_dir: /ycsb
    # Keep container running for interactive use
    tty: true
    stdin_open: true

networks:
  ycsb-network:
    driver: bridge

volumes:
  ycsb-results:
  postgres-data:
  mysql-data:
